<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GAMES PAGE FOR TEACHER TOOLS UNBLOCKED</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      background-color: #000000;
      overflow-x: hidden;
      font-family: 'Impact', 'Arial Narrow Bold', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -9999;
      pointer-events: none;
      background-color: #000000;
      background-image: radial-gradient(
        circle at center, 
        #0000ff 0px, 
        #0000ff 2px, 
        transparent 2px
      );
      background-size: 16px 16px;
      background-repeat: repeat;
      animation: sparkleFlash 0.8s infinite alternate ease-in-out;
    }

    @keyframes sparkleFlash {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    h1 {
      color: #ff0000;
      font-size: 64px;
      letter-spacing: 4px;
      margin-bottom: 40px;
      -webkit-text-stroke: 2px #000000;
      text-shadow: 
        -3px -3px 0 #000,  
         3px -3px 0 #000,
        -3px  3px 0 #000,
         3px  3px 0 #000;
      z-index: 10;
    }

    a {
      text-decoration: none;
      z-index: 10;
    }

    figure {
      margin: 0;
      padding: 15px;
      background-color: #ff0000;
      border: 4px solid #000000;
      box-shadow: 0 10px 0 #000000;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      max-width: 300px;
    }

    figure:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 0 #000000;
    }

    figure:active {
      transform: translateY(4px);
      box-shadow: 0 6px 0 #000000;
    }

    img {
      width: 100%;
      height: auto;
      display: block;
      border: 4px solid #000000;
      box-sizing: border-box;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;      
      image-rendering: pixelated;   
    }

    figcaption {
      color: #0000ff;
      font-size: 32px;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #000000;
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
    }
  </style>
</head>
<body>

  <h1>GAMES</h1>

  <a href="content/games/2048/index.html">
    <figure>
      <img src="content/games/2048/2048.png" alt="2048 Game Box Art">
      <figcaption>2048</figcaption>
    </figure>
  </a>

</body>
</html>
