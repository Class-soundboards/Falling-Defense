<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GAMES PAGE FOR TEACHER TOOLS UNBLOCKED</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      position: relative;
      background-color: #000000;
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'Impact', 'Arial Narrow Bold', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -9999;
      pointer-events: none;
      background-color: #000000;
      background-image: radial-gradient(
        circle at center, 
        #0000ff 0px, 
        #0000ff 2px, 
        transparent 2px
      );
      background-size: 16px 16px;
      background-repeat: repeat;
      animation: sparkleFlash 0.8s infinite alternate ease-in-out;
    }

    @keyframes sparkleFlash {
      0% {
        opacity: 0.3;
        transform: scale(1);
      }
      100% {
        opacity: 1;
        transform: scale(1.05);
      }
    }

    h1 {
      color: #ff0000;
      font-size: 64px;
      letter-spacing: 4px;
      margin-bottom: 40px;
      -webkit-text-stroke: 2px #000000;
      text-shadow: 
        -3px -3px 0 #000,  
         3px -3px 0 #000,
        -3px  3px 0 #000,
         3px  3px 0 #000;
      z-index: 10;
    }

    .games-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 30px;
      width: 100%;
      max-width: 1400px;
      z-index: 10;
      box-sizing: border-box;
      padding: 0 20px;
    }

    @media (max-width: 1200px) {
      .games-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 900px) {
      .games-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .games-grid {
        grid-template-columns: 1fr;
      }
    }

    a {
      text-decoration: none;
      display: block;
    }

    figure {
      margin: 0;
      padding: 15px;
      background-color: #ff0000;
      border: 4px solid #000000;
      box-shadow: 0 10px 0 #000000;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
    }

    figure:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 0 #000000;
    }

    figure:active {
      transform: translateY(4px);
      box-shadow: 0 6px 0 #000000;
    }

    .img-container {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      border: 4px solid #000000;
      box-sizing: border-box;
      background-color: #000;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;      
      image-rendering: pixelated;   
    }

    figcaption {
      color: #0000ff;
      font-size: 28px;
      font-weight: bold;
      text-align: center;
      margin-top: 15px;
      text-transform: uppercase;
      -webkit-text-stroke: 1px #000000;
      text-shadow: 
        -2px -2px 0 #000,  
         2px -2px 0 #000,
        -2px  2px 0 #000,
         2px  2px 0 #000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <h1>GAMES</h1>

  <div class="games-grid">
    <a href="content/games/2048/index.html">
      <figure>
        <div class="img-container">
          <img src="content/games/2048/2048.png" alt="2048 Game Box Art">
        </div>
        <figcaption>2048</figcaption>
      </figure>
    </a>

    <a href="content/games/Whack_A_Mole/whack-a-mole.html">
      <figure>
        <div class="img-container">
          <img src="content/games/Whack_A_Mole/whack-a-mole.png" alt="Whack A Mole Game Box Art">
        </div>
        <figcaption>WHACK A MOLE</figcaption>
      </figure>
    </a>
  </div>

</body>
</html>
